services:
  - type: web
    name: seller-finder-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: seller_finder
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_FRONTEND_URL
        sync: false
      - key: SEARCH_PROVIDER
        value: none
      - key: SEARCH_API_KEY
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_API_BASE_URL
        sync: false
      - key: AI_API_MODEL
        value: gpt-4o-mini
      - key: HUNTER_API_KEY
        sync: false
      - key: ADMIN_API_TOKEN
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: AUTH_EMAIL
        sync: false
      - key: AUTH_PASSWORD
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
