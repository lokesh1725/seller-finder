<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Seller Information Finder - discover verified business contacts for Indian fashion D2C brands, e-commerce sellers, manufacturers and suppliers." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Seller Information Finder" />
    <meta property="og:title" content="Seller Information Finder" />
    <meta property="og:description" content="Find business profiles, contacts and sources for Indian fashion brands, sellers and manufacturers." />
    <meta property="og:image" content="/og-default.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Seller Information Finder</title>
    <script>
      (function () {
        try {
          var key = "seller_finder_theme";
          var theme = localStorage.getItem(key);
          if (theme !== "dark" && theme !== "light") {
            theme =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          }
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
