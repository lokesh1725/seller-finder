<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Illustration of searching and verifying business listings">
  <circle cx="150" cy="110" r="95" fill="#eef2ff" />
  <circle cx="470" cy="510" r="120" fill="#e0e7ff" opacity="0.7" />
  <circle cx="500" cy="120" r="34" fill="#c7d2fe" opacity="0.6" />
  <circle cx="95" cy="470" r="20" fill="#c7d2fe" opacity="0.7" />

  <!-- search bar -->
  <rect x="80" y="105" width="440" height="66" rx="33" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
  <circle cx="126" cy="138" r="12" fill="none" stroke="#94a3b8" stroke-width="4" />
  <line x1="135" y1="147" x2="147" y2="159" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
  <rect x="176" y="130" width="190" height="15" rx="7" fill="#e2e8f0" />
  <rect x="380" y="127" width="112" height="21" rx="10" fill="#4f46e5" opacity="0.16" />

  <!-- first result card -->
  <rect x="80" y="200" width="440" height="132" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
  <circle cx="150" cy="266" r="30" fill="#eef2ff" />
  <circle cx="150" cy="257" r="10" fill="#4f46e5" />
  <path d="M132 288a18 18 0 0136 0z" fill="#4f46e5" />
  <rect x="200" y="243" width="200" height="15" rx="7" fill="#cbd5e1" />
  <rect x="200" y="270" width="130" height="12" rx="6" fill="#e2e8f0" />
  <circle cx="205" cy="310" r="7" fill="#f59e0b" />
  <path d="M205 303c4 0 7 3 7 7 0 5-7 12-7 12s-7-7-7-12c0-4 3-7 7-7z" fill="#f59e0b" />
  <rect x="222" y="304" width="86" height="12" rx="6" fill="#e2e8f0" />
  <rect x="330" y="301" width="16" height="18" rx="4" fill="#10b981" opacity="0.85" />
  <rect x="354" y="304" width="70" height="12" rx="6" fill="#e2e8f0" />

  <!-- verified badge -->
  <circle cx="486" cy="238" r="21" fill="#10b981" />
  <path d="M477 238l6 6 13-14" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- second result card -->
  <rect x="110" y="352" width="440" height="120" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" opacity="0.9" />
  <circle cx="180" cy="412" r="26" fill="#eef2ff" />
  <circle cx="180" cy="405" r="9" fill="#4338ca" />
  <path d="M164 434a16 16 0 0132 0z" fill="#4338ca" />
  <rect x="226" y="392" width="170" height="14" rx="7" fill="#cbd5e1" />
  <rect x="226" y="417" width="110" height="11" rx="5" fill="#e2e8f0" />

  <!-- magnifier -->
  <circle cx="438" cy="438" r="70" fill="#eef2ff" stroke="#4f46e5" stroke-width="11" />
  <path d="M438 402c-8 0-15 5-15 13 0 10 15 24 15 24s15-14 15-24c0-8-7-13-15-13z" fill="#4f46e5" />
  <line x1="490" y1="490" x2="552" y2="552" stroke="#4f46e5" stroke-width="18" stroke-linecap="round" />
</svg>
